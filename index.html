<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BVA Prüfungstraining</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#233449;background:#f3f6fa}body{max-width:690px;margin:24px auto;padding:0 16px 50px}h1{color:#174a78;font-size:1.7rem}h2{font-size:1.2rem}.panel,.frage{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 10px #132b4512}.meta{color:#536577}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:100px;background:#edf3f8;border-radius:10px;padding:12px}.stat strong{display:block;font-size:1.5rem}.bar{height:12px;border-radius:10px;background:#e0e8ee;overflow:hidden;margin:12px 0}.fill{height:100%;background:#248879;width:0%;transition:width .25s}label.option{display:block;border:1px solid #dbe3ec;border-radius:8px;padding:12px;margin:9px 0;cursor:pointer}input{margin-right:9px}button{background:#174a78;color:white;border:0;padding:14px 18px;border-radius:9px;font-size:1rem;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.5;cursor:default}.secondary{background:#e6eef5;color:#174a78}.feedback{border-left:4px solid #248879;padding-left:12px;margin:15px 0}.wrong{border-left-color:#b77d36}.small{font-size:.9rem;color:#536577}select{display:block;width:100%;margin-top:12px;padding:13px;border:1px solid #c8d5e2;border-radius:9px;background:white;color:#233449;font:inherit;max-width:100%}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f0a63c;outline-offset:3px}

/* iPhone: feste Kartenbreite und saubere Textumbrueche */
*,*::before,*::after{box-sizing:border-box}
.frage{min-width:0;width:100%;overflow-wrap:break-word}
.frage h3{font-size:1.05rem;line-height:1.45;margin:0 0 14px;overflow-wrap:anywhere}
label.option{display:flex;align-items:flex-start;gap:11px;min-width:0;line-height:1.45}
label.option input{flex:0 0 auto;margin:4px 0 0}
label.option span{flex:1;min-width:0;overflow-wrap:break-word}
</style>
</head>
<body>
<h1>📘 BVA Prüfungstraining</h1>
<p class="meta">Sechs Fachbereiche · Kurztests · ohne Zeitlimit</p>
<section class="panel"><label for="subjectSelect"><strong>Prüfungsfach auswählen</strong></label><select id="subjectSelect" aria-label="Prüfungsfach auswählen"></select><p class="small">Je Fach drei Einstiegsfragen. Die Auswertung erfolgt direkt nach Abgabe.</p></section>
<section class="panel" aria-label="Wochenfortschritt">
<h2>Deine Lernwoche</h2>
<p id="weekLabel" class="small"></p>
<div class="stats"><div class="stat">Lernpunkte<strong id="weeklyPoints">0</strong></div><div class="stat">Tests<strong id="weeklyTests">0</strong></div><div class="stat">Stufe<strong id="weeklyLevel">Bronze</strong></div></div>
<div class="bar" aria-label="Fortschritt zur nächsten Stufe"><div class="fill" id="weeklyBar"></div></div>
<p class="small" id="nextLevel"></p><p class="small">Jede Woche beginnt neu. Keine Pflichtziele und keine Punktabzüge.</p>
</section>
<section id="quiz" aria-label="Testfragen"></section>
<button id="submit" type="button">Test abgeben</button>
<section id="result" class="panel" aria-live="polite" hidden></section>
<button id="email" type="button" hidden>✉️ Ergebnis per E-Mail vorbereiten</button>
<button id="restart" class="secondary" type="button" hidden>Test erneut üben</button>
<script>
'use strict';
const recipient='j.paulik@mail.de';
const subject='BVA Prüfungstraining – Testergebnis';
const subjectTasks={"Verwaltungsorganisation":[{"question":"Was zeigt ein Organisationsplan?","answers":["Die Urlaubszeiten der Beschäftigten","Den organisatorischen Aufbau einer Behörde","Die Haushaltsausgaben"],"correct":1,"topic":"Organisationsplan","explanation":"Der Organisationsplan stellt die organisatorische Gliederung einer Behörde dar."},{"question":"Was kennzeichnet das Einliniensystem?","answers":["Jede Person hat grundsätzlich eine unmittelbar weisungsbefugte Führungskraft","Jede Person hat mehrere gleichrangige Vorgesetzte","Es bestehen keine Weisungsbefugnisse"],"correct":0,"topic":"Einliniensystem","explanation":"Im Einliniensystem gibt es grundsätzlich einen eindeutigen Weisungsweg."},{"question":"Welche Aufgabe hat eine Stabsstelle?","answers":["Sie erteilt allen Referaten Weisungen","Sie ersetzt die Behördenleitung","Sie berät und unterstützt die Leitung"],"correct":2,"topic":"Stabsstelle","explanation":"Stabsstellen beraten und unterstützen; aus der Stabsfunktion folgt keine allgemeine Weisungsbefugnis."}],"Beamtenrecht":[{"question":"Wie erfolgt eine Ernennung nach dem Bundesbeamtengesetz?","answers":["Durch mündliche Zusage","Durch Aushändigung einer Ernennungsurkunde","Durch Eintrag in den Geschäftsverteilungsplan"],"correct":1,"topic":"Ernennung","explanation":"Nach § 10 Abs. 2 Satz 1 BBG erfolgt die Ernennung durch Aushändigung einer Ernennungsurkunde."},{"question":"Was muss eine Beamtin bei Bedenken gegen die Rechtmäßigkeit einer dienstlichen Anordnung grundsätzlich tun?","answers":["Die Anordnung ohne Mitteilung ignorieren","Ihre Bedenken unverzüglich auf dem Dienstweg geltend machen","Sofort eine Pressemitteilung veröffentlichen"],"correct":1,"topic":"Remonstration","explanation":"§ 63 Abs. 2 Satz 1 BBG verlangt, Bedenken unverzüglich bei der oder dem unmittelbaren Vorgesetzten geltend zu machen."},{"question":"Welche Aussage zur Übernahme von Verantwortung für dienstliche Handlungen trifft zu?","answers":["Beamtinnen und Beamte tragen für die Rechtmäßigkeit ihrer dienstlichen Handlungen die volle persönliche Verantwortung","Nur die Behördenleitung trägt Verantwortung","Verantwortung besteht ausschließlich bei schriftlichen Anordnungen"],"correct":0,"topic":"Verantwortung","explanation":"Das ist der Grundsatz aus § 63 Abs. 1 BBG."}],"Arbeits- und Tarifrecht":[{"question":"Welche Rechtsgrundlage regelt grundsätzlich die Arbeitsbedingungen der Tarifbeschäftigten des Bundes?","answers":["TVöD (Bund)","Bundesbeamtengesetz","Bundeshaushaltsordnung"],"correct":0,"topic":"TVöD","explanation":"Für Tarifbeschäftigte des Bundes gilt grundsätzlich der TVöD, soweit sein Geltungsbereich eröffnet ist."},{"question":"Wie viele Monate beträgt die Probezeit nach § 2 Abs. 4 TVöD grundsätzlich?","answers":["Drei Monate","Sechs Monate","Zwölf Monate"],"correct":1,"topic":"Probezeit","explanation":"Nach § 2 Abs. 4 TVöD gelten die ersten sechs Monate grundsätzlich als Probezeit, soweit keine Sonderregelung greift."},{"question":"Welche Form ist für die Kündigung eines Arbeitsverhältnisses gesetzlich vorgeschrieben?","answers":["Mündliche Erklärung","Einfache E-Mail","Schriftform"],"correct":2,"topic":"Kündigungsform","explanation":"§ 623 BGB schreibt die Schriftform vor; die elektronische Form ist ausgeschlossen."}],"Beihilferecht":[{"question":"Wozu dient die Beihilfe des Bundes?","answers":["Zur pauschalen Erstattung sämtlicher Lebenshaltungskosten","Zur ergänzenden Beteiligung an bestimmten Krankheits-, Pflege- und Geburtskosten","Zur Finanzierung von Dienstreisen"],"correct":1,"topic":"Zweck der Beihilfe","explanation":"Die Beihilfe ergänzt die Eigenvorsorge in bestimmten gesetzlich geregelten Fällen; maßgeblich sind § 80 BBG und die BBhV."},{"question":"Welche Regelung enthält nähere Vorschriften zur Beihilfe des Bundes?","answers":["Bundesbeihilfeverordnung (BBhV)","Bundeshaushaltsordnung (BHO)","Bundesreisekostengesetz (BRKG)"],"correct":0,"topic":"Rechtsgrundlage","explanation":"Die Bundesbeihilfeverordnung konkretisiert die Beihilfevorschriften des Bundes."},{"question":"Ist jede privat bezahlte Gesundheitsleistung automatisch beihilfefähig?","answers":["Ja, immer","Nur wenn sie im Ausland erbracht wurde","Nein, die Beihilfefähigkeit richtet sich nach den einschlägigen Vorschriften"],"correct":2,"topic":"Beihilfefähigkeit","explanation":"Nicht jede Ausgabe ist beihilfefähig; Voraussetzungen und Begrenzungen ergeben sich aus der BBhV."}],"Reisekostenrecht":[{"question":"Welches Gesetz regelt die Reisekostenvergütung für Dienstreisen von Bundesbediensteten?","answers":["BRKG","BBG allein","BHO allein"],"correct":0,"topic":"Rechtsgrundlage","explanation":"Maßgeblich ist das Bundesreisekostengesetz (BRKG)."},{"question":"Was ist eine Dienstreise im Sinne des BRKG?","answers":["Jeder private Weg zur Arbeitsstätte","Eine Reise zur Erledigung von Dienstgeschäften außerhalb der Dienststätte","Jede Urlaubsreise"],"correct":1,"topic":"Dienstreise","explanation":"§ 2 Abs. 1 BRKG definiert Dienstreisen als Reisen zur Erledigung von Dienstgeschäften außerhalb der Dienststätte."},{"question":"Was gehört nach § 1 Abs. 2 BRKG grundsätzlich zur Reisekostenvergütung?","answers":["Fahrt- und Flugkostenerstattung","Ein pauschaler Jahresbonus","Ein Zuschuss zum privaten Autokauf"],"correct":0,"topic":"Reisekostenarten","explanation":"§ 1 Abs. 2 BRKG nennt unter anderem Fahrt- und Flugkostenerstattung."}],"HKR / Haushaltsrecht":[{"question":"Was bedeutet der Grundsatz der Einzelveranschlagung nach § 17 Abs. 1 BHO?","answers":["Einnahmen und Ausgaben sind grundsätzlich nach Zwecken getrennt zu veranschlagen","Alle Ausgaben werden in einem einzigen Titel erfasst","Haushaltsmittel können ohne Zweckbindung ausgegeben werden"],"correct":0,"topic":"Einzelveranschlagung","explanation":"§ 17 Abs. 1 BHO verlangt grundsätzlich die getrennte Veranschlagung nach Zwecken."},{"question":"Welche Vorschrift der BHO regelt die Deckungsfähigkeit?","answers":["§ 20 BHO","§ 10 BBG","§ 2 BRKG"],"correct":0,"topic":"Deckungsfähigkeit","explanation":"Die Deckungsfähigkeit von Ausgaben ist in § 20 BHO geregelt."},{"question":"Was bedeutet die sachliche Bindung eines Haushaltstitels?","answers":["Die Mittel dürfen grundsätzlich nur für den vorgesehenen Zweck verwendet werden","Die Mittel dürfen immer für beliebige Zwecke verwendet werden","Die Mittel müssen monatlich vollständig ausgegeben werden"],"correct":0,"topic":"Zweckbindung","explanation":"Die Verwendung richtet sich nach der Zweckbestimmung des Titels; vgl. insbesondere § 45 Abs. 1 BHO."}]};
let currentSubject=Object.keys(subjectTasks)[0];
let tasks=subjectTasks[currentSubject];
const $=id=>document.getElementById(id);
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function weekStart(date=new Date()){const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()-(d.getDay()+6)%7);return localDate(d);}
const storageKey='bva-week-v2';
function getWeek(){const key=weekStart();try{const obj=JSON.parse(localStorage.getItem(storageKey));if(obj&&obj.week===key&&Number.isFinite(obj.points)&&Number.isFinite(obj.tests)&&obj.points>=0&&obj.tests>=0)return obj;}catch(e){}return {week:key,points:0,tests:0};}
function saveWeek(obj){try{localStorage.setItem(storageKey,JSON.stringify(obj));return true;}catch(e){return false;}}
function level(p){return p>=200?'Gold':p>=100?'Silber':'Bronze';}
function renderWeek(){const w=getWeek();$('weekLabel').textContent='Woche ab '+new Date(w.week+'T12:00:00').toLocaleDateString('de-DE');$('weeklyPoints').textContent=w.points;$('weeklyTests').textContent=w.tests;$('weeklyLevel').textContent=level(w.points);const threshold=w.points<100?100:w.points<200?200:200;$('weeklyBar').style.width=Math.min(100,w.points/threshold*100)+'%';$('nextLevel').textContent=w.points>=200?'Gold erreicht! ⭐':`${threshold-w.points} Punkte bis ${threshold===100?'Silber':'Gold'}.`;}
function renderQuiz(){const quiz=$('quiz');quiz.replaceChildren();tasks.forEach((t,i)=>{const box=document.createElement('div');box.className='frage';box.setAttribute('role','group');const heading=document.createElement('h3');heading.id='question-'+i;heading.textContent=`Frage ${i+1}: ${t.question}`;box.setAttribute('aria-labelledby',heading.id);box.append(heading);t.answers.forEach((a,j)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=String(j);const answerText=document.createElement('span');answerText.textContent=a;label.append(input,answerText);box.append(label);});quiz.append(box);});}
let emailText='';let submitted=false;
function submitTest(){if(submitted)return;submitted=true;let correct=0;const details=[];const result=$('result');result.replaceChildren();tasks.forEach((t,i)=>{const selected=document.querySelector(`input[name="q${i}"]:checked`);const answer=selected?Number(selected.value):-1;const ok=answer===t.correct;if(ok)correct++;details.push({task:t,answer,ok});});
const percent=Math.round(100*correct/tasks.length);const w=getWeek();w.points+=correct*10;w.tests+=1;const saved=saveWeek(w);renderWeek();
const heading=document.createElement('h2');heading.textContent=`Dein Ergebnis: ${correct}/${tasks.length} (${percent} %) · +${correct*10} Lernpunkte`;result.append(heading);
const encouragement=document.createElement('p');encouragement.textContent=correct===tasks.length?'Alle Fragen richtig! Super gemacht!':correct>0?'Gut gemacht! Du hast neue Lernpunkte gesammelt.':'Du hast geübt – auch das ist ein wichtiger Schritt. Versuch es gern erneut.';result.append(encouragement);
if(!saved){const note=document.createElement('p');note.textContent='Hinweis: Dein Browser konnte den Wochenstand nicht dauerhaft speichern.';result.append(note);}
emailText=`BVA Prüfungstraining\nFach: ${currentSubject}\nDatum: ${new Date().toLocaleString('de-DE')}\nErgebnis: ${correct}/${tasks.length} (${percent} %)\nLernpunkte in diesem Test: ${correct*10}\nWochenpunkte: ${w.points}\nWochenstufe: ${level(w.points)}\n\n`;
details.forEach(({task,answer,ok},i)=>{const section=document.createElement('div');section.className='feedback'+(ok?'':' wrong');const title=document.createElement('strong');title.textContent=`Frage ${i+1} · ${task.topic}: ${ok?'Richtig ✓':'Noch üben'}`;const p=document.createElement('p');p.textContent='Deine Antwort: '+(answer<0?'Nicht beantwortet':task.answers[answer]);const solution=document.createElement('p');solution.textContent='Richtige Antwort: '+task.answers[task.correct];const explanation=document.createElement('p');explanation.textContent=task.explanation;section.append(title,p,solution,explanation);result.append(section);emailText+=`Frage ${i+1}: ${task.question}\nDeine Antwort: ${answer<0?'Nicht beantwortet':task.answers[answer]}\nRichtige Antwort: ${task.answers[task.correct]}\nBewertung: ${ok?'Richtig':'Falsch / unbeantwortet'}\nErklärung: ${task.explanation}\n\n`;});
result.hidden=false;$('email').hidden=false;$('restart').hidden=false;$('submit').disabled=true;document.querySelectorAll('#quiz input').forEach(el=>el.disabled=true);result.scrollIntoView({behavior:'smooth',block:'start'});
}
const select=$('subjectSelect');Object.keys(subjectTasks).forEach(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;select.append(option);});
select.addEventListener('change',()=>{currentSubject=select.value;tasks=subjectTasks[currentSubject];submitted=false;emailText='';$('result').hidden=true;$('email').hidden=true;$('restart').hidden=true;$('submit').disabled=false;renderQuiz();});
$('submit').addEventListener('click',submitTest);
$('email').addEventListener('click',()=>{if(!submitted)return;window.location.href='mailto:'+recipient+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(emailText);});
$('restart').addEventListener('click',()=>{submitted=false;emailText='';$('result').hidden=true;$('email').hidden=true;$('restart').hidden=true;$('submit').disabled=false;renderQuiz();window.scrollTo({top:0,behavior:'smooth'});});
renderWeek();renderQuiz();
</script>
</body>
</html>
